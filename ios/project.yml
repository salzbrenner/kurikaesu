name: StudyList
options:
  bundleIdPrefix: com.studylist
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_ENTITLEMENTS: ""

packages:
  SQLite:
    url: https://github.com/stephencelis/SQLite.swift
    from: "0.15.0"

targets:
  StudyListApp:
    type: application
    platform: iOS
    sources:
      - StudyListApp
    settings:
      base:
        INFOPLIST_FILE: StudyListApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.studylist.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
    dependencies:
      - target: StudyListWidget
      - package: SQLite
        product: SQLite
    entitlements:
      path: StudyListApp/StudyListApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.studylist.app

  StudyListWidget:
    type: app-extension
    platform: iOS
    sources:
      - StudyListWidget
    settings:
      base:
        INFOPLIST_FILE: StudyListWidget/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.studylist.app.widget
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: StudyListWidget/StudyListWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.studylist.app